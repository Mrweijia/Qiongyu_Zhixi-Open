[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qiongyu-zhixi-sdk"
version = "0.1.0"
description = "Python client and command-line tools for the Qiongyu Zhixi API"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Qiongyu Zhixi contributors"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
qiongyu = "qiongyu_sdk.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["qiongyu_sdk*"]
